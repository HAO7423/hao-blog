name: Deploy to GitHub Pages

# 把博客自动发布到 GitHub Pages。
# 触发方式：推送到 main（例如写完文章 git push），或在 Actions 页面手动运行。
#
# 部署地址：https://<用户名>.github.io/<仓库名>/
# 首次运行时 configure-pages 会自动为仓库启用 Pages，无需手动去设置页点开关。

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不要取消进行中的部署，避免发布出半成品站点
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # 版本取自 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether GitHub Pages is enabled
        # 这一步的作用只是把报错变清楚。
        # GitHub Pages 无法由任何 token 通过 API 首次创建（默认 GITHUB_TOKEN
        # 会返回 "Resource not accessible by integration"），必须在仓库设置里
        # 手动启用一次。若不先检查，后面 configure-pages 只会抛出一句含糊的
        # "Get Pages site failed"，让人不知道该怎么办。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "GitHub Pages 已启用，继续部署。"
          else
            echo "::error title=需要手动启用 GitHub Pages::请打开 https://github.com/${{ github.repository }}/settings/pages ，把 Build and deployment 的 Source 设为 \"GitHub Actions\"（只需一次）。保存后回到 Actions 页面重新运行本 workflow，或在本地 git push 一个空提交来触发。"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # 刻意不使用 enablement: true —— 已实测它必然失败：
        #   Create Pages site failed. Error: Resource not accessible by integration
        # 因为默认 GITHUB_TOKEN 没有创建 Pages 站点的权限。
        # 上一一步已经检查过 Pages 是否启用，并给出明确指引。

      - name: Build site
        # 注意这里是 pnpm build，不是 astro build —— 前者会额外执行
        # pagefind 生成站内搜索索引，漏掉它搜索会静默失效。
        run: pnpm build
        env:
          # GitHub Pages 的项目仓库部署在 /<仓库名>/ 子路径下，
          # 因此 site 与 base 必须分开设置。所有内部链接都经由
          # src/utils/url-utils.ts 拼上 import.meta.env.BASE_URL，
          # 所以这里设置好即可，代码无需改动。
          # （若仓库改名为 <用户名>.github.io，则 BASE_PATH 应设为 "/"）
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
